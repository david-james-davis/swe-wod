<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SWE • Word of the Day</title>
<meta name="theme-color" content="#0d0d0d" />
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="data:;base64,=">
<style>
  :root {
    color-scheme: light dark;
    --cta-bg: linear-gradient(135deg, #0ea5e9 0%, #2563eb 55%, #1d4ed8 100%);
    --cta-text: #f8fbff;
    --cta-shadow: 0 12px 28px rgba(29, 78, 216, 0.28);
    --cta-shadow-hover: 0 16px 34px rgba(29, 78, 216, 0.35);
    --cta-ring: #60a5fa;
  }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
  .card { max-width: 720px; margin: 0 auto; padding: 1.25rem; border: 1px solid #ddd; border-radius: 12px; }
  .muted { color: #666; }
  code { background: color-mix(in oklab, canvas 80%, black 5%); padding: .1rem .3rem; border-radius: .35rem; }
  .subscribe-btn {
    margin-top: 0.75rem;
    border: 0;
    border-radius: 999px;
    padding: 0.72rem 1.2rem;
    background: var(--cta-bg);
    color: var(--cta-text);
    font: 600 0.96rem/1.1 system-ui, sans-serif;
    letter-spacing: 0.01em;
    box-shadow: var(--cta-shadow);
    cursor: pointer;
    transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
  }
  .subscribe-btn:hover {
    transform: translateY(-1px);
    filter: saturate(1.08);
    box-shadow: var(--cta-shadow-hover);
  }
  .subscribe-btn:active {
    transform: translateY(0);
    box-shadow: 0 8px 20px rgba(29, 78, 216, 0.3);
  }
  .subscribe-btn:focus-visible {
    outline: 3px solid var(--cta-ring);
    outline-offset: 3px;
  }
</style>
<body>
  <div class="card">
    <h1>SWE Word of the Day</h1>
    
    <p id="date" class="muted"></p>
    <h2 id="word"></h2>
    <p id="pos" class="muted"></p>
    <p id="definition"></p>
    <p><em id="example"></em></p>
    <p class="muted" style="margin-top:1rem">Source: OpenAI (auto-updated daily)</p>
    <button id="enablePush" class="subscribe-btn">🔔 Enable daily notifications</button>
    <!-- <button id="disablePush">🔕 Disable notifications</button> -->
  </div>

<script type="module">
async function load() {
  try {
    const res = await fetch('./wod.json', { cache: 'no-store' });
    const items = await res.json(); // array of entries
    if (!Array.isArray(items) || items.length === 0) throw new Error("empty");

    // pick latest by date
    const latest = items.reduce((a, b) => (a.date > b.date ? a : b));
    document.getElementById('date').textContent = latest.date;
    document.getElementById('word').textContent = latest.word;
    document.getElementById('pos').textContent = latest.partOfSpeech ? `(${latest.partOfSpeech})` : '';
    document.getElementById('definition').textContent = latest.definition;
    document.getElementById('example').textContent = latest.example;
  } catch {
    document.getElementById('definition').textContent = 'No word yet—check back soon.';
  }
}
load();

const VAPID_FALLBACK_KEY = 'BP5lZK2vAzFgpjU0dYqqG3HZ337dXCUEInVb2te-ZZnUsyytz7fKFXgSU1MNIQr8MhVRTENMdq-W1IAQ5G9Llaw';
const VAPID_URL = 'https://wod-push.davidjamesdavis-djd.workers.dev/vapid';

function b64urlToUint8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64), out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

async function enablePush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      console.error('Push not supported'); alert('Push not supported'); return;
    }

    console.log('Registering SW…');
    await navigator.serviceWorker.register('/sw.js', { scope: '/' });

    // IMPORTANT: wait for the ACTIVE registration that will handle push
    const reg = await navigator.serviceWorker.ready;
    console.log('SW ready:', !!reg, reg?.scope);

    const perm = await Notification.requestPermission();
    console.log('Notification permission:', perm);
    if (perm !== 'granted') { alert('Please allow notifications'); return; }

    // Clean any stale/bad subscription
    const existing = await reg.pushManager.getSubscription();
    console.log('Existing subscription?', !!existing);
    if (existing) {
      try {
        const ok = await existing.unsubscribe();
        console.log('Unsubscribed previous?', ok);
      } catch (e) { console.warn('Unsubscribe failed (ignored):', e); }
    }

    let publicKey = VAPID_FALLBACK_KEY;
    try {
      const res = await fetch(VAPID_URL, { cache: 'no-store' });
      if (res.ok) {
        const { publicKey: k } = await res.json();
        if (typeof k === 'string' && k.length > 20) publicKey = k;
      }
    } catch (e) {
      console.warn('Failed to fetch VAPID key, using fallback', e);
    }

    const key = b64urlToUint8(publicKey);
    console.log('VAPID key bytes:', key.length, 'firstByte:', key[0]); // expect 65 and 4

    // The call that throws AbortError if FCM registration fails
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: key,
    });
    console.log('Subscribed OK:', sub.endpoint);

    const resp = await fetch('https://wod-push.davidjamesdavis-djd.workers.dev/subscribe', {
      method: 'POST',
      mode: 'cors',
      keepalive: true,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub.toJSON()),
      credentials: 'omit',
    });
    console.log('POST /subscribe status:', resp.status);
    if (!resp.ok) throw new Error('Subscribe POST failed: ' + resp.status);
    alert('Notifications enabled!');
  } catch (e) {
    console.error('enablePush error:', e.name, e.message, e);
    alert('Failed to enable notifications. See console for details.');
  }
}

document.getElementById('enablePush')?.addEventListener('click', enablePush);
</script>
