name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you have NO build step (just plain HTML/CSS/JS in repo root):
      # - name: Prepare static site
      #   run: |
      #     mkdir -p ./_site
      #     shopt -s extglob
      #     cp -R !(node_modules|.git|_site|.github) ./_site
      #     touch ./_site/.nojekyll

      # If you DO have a Node build (e.g., Vite/React), uncomment this block and set the output dir
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm i; fi

      - name: Build
        run: npm run build

      # Adjust this path to your build output (Vite defaults to "dist")
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
